name: Bouw en publiceer

on:
  push:
    branches: [main]
  schedule:
    # Elke ochtend om 07:00 Nederlandse tijd: 05:00 UTC in de zomertijd, 06:00 UTC in de wintertijd.
    # build.py toont een bulletin pas vanaf 07:00 op zijn eigen datum, dus de vroege run in de winter publiceert niets nieuws.
    - cron: "0 5,6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
